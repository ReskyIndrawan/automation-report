name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Set UTF-8 encoding
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONIOENCODING = "utf-8"

      - name: Build executable
        run: python scripts/build_windows_exe.py

      - name: Show build directory structure
        shell: powershell
        run: |
          Write-Host "Build directory structure:"
          Get-ChildItem -Path . -Recurse -Include "dist", "build" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            if ($_.PSIsContainer) {
              Get-ChildItem $_.FullName -Recurse | ForEach-Object {
                Write-Host "  $($_.FullName)"
              }
            }
          }

      - name: Verify executable exists
        shell: powershell
        run: |
          if (!(Test-Path "dist\ReportAutomation.exe")) {
            Write-Error "Executable not found at dist\ReportAutomation.exe"
            exit 1
          }
          Write-Host "Executable found successfully"
          Get-Item "dist\ReportAutomation.exe"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            dist/ReportAutomation.exe
            install.bat

      - name: Create release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}-windows
          name: Report Automation Windows Executable v${{ github.run_number }}
          body: |
            Windows executable version of Report Automation application.

            ## Files:
            - ReportAutomation.exe: Standalone Windows application
            - install.bat: Installation script

            ## How to use:
            1. Download ReportAutomation.exe
            2. Run the executable directly
            3. Or run install.bat to copy to desktop

            Generated from commit: ${{ github.sha }}
          files: |
            dist/ReportAutomation.exe
            install.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}