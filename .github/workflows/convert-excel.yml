name: Convert Excel for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  convert-excel:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Run Excel conversion
        run: python scripts/convert_excel_windows.py

      - name: Upload converted files
        uses: actions/upload-artifact@v3
        with:
          name: windows-excel-files
          path: file_windows/

      - name: Upload CSV backups
        uses: actions/upload-artifact@v3
        with:
          name: csv-backups
          path: file_windows/*.csv

      - name: Create release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Windows Excel Files v${{ github.run_number }}
          body: |
            Windows-compatible Excel files generated from the latest report automation.

            ## Files:
            - Excel files with _windows suffix: Optimized for Windows Excel
            - CSV files: Backup format for maximum compatibility

            Generated from commit: ${{ github.sha }}
          files: file_windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}